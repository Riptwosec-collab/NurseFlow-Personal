  <link rel="manifest" href="./manifest.webmanifest" />

<body>
  <svg class="svg-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">

    <symbol id="ic-chart" viewBox="0 0 24 24"><path d="M3 3v18h18M8 16v-5m5 5V7m5 9v-8"/></symbol>

  <div class="app-shell">
    <aside class="sidebar" aria-label="เมนูหลัก">
      <div class="brand"><span class="brand-mark"><span>+</span></span><div class="brand-txt"><strong>Nurse<span>Flow</span></strong><small>PERSONAL PLANNER</small></div></div>
      <div class="nav-section-label">MY SPACE</div>
      <nav class="nav-list" id="desktop-nav">
        <button type="button" class="nav-link active" data-page="home"><svg><use href="#ic-house"/></svg><span>หน้าหลัก</span></button>
        <button type="button" class="nav-link" data-page="calendar"><svg><use href="#ic-calendar"/></svg><span>ตารางเวร</span></button>
        <button type="button" class="nav-link" data-page="stats"><svg><use href="#ic-chart"/></svg><span>สถิติของฉัน</span></button>
        <button type="button" class="nav-link" data-page="settings"><svg><use href="#ic-settings"/></svg><span>ตั้งค่า</span></button>
      </nav>
      <div class="sidebar-bottom"><div class="little-blobs"><span></span><span></span><span></span></div><strong>Take care of yourself ♡</strong><p>จัดเวรให้ง่ายขึ้น แล้วมีเวลาให้ตัวเองมากขึ้น</p></div>
      <div class="privacy-pill"><svg><use href="#ic-shield"/></svg> ข้อมูลอยู่ในเครื่อง เว้นแต่เปิด Cloud Sync</div>
    </aside>
    <div class="main-area">
      <header class="topbar"><div class="breadcrumb"><span class="mobile-brand"><span class="brand-mark small">+</span> Nurse<span>Flow</span></span><span id="page-crumb">พื้นที่ส่วนตัว <b>/</b> หน้าหลัก</span></div><div class="header-actions"><span class="local-badge"><span></span> Private by default</span><button type="button" class="avatar-btn" id="quick-settings" aria-label="การตั้งค่า">NF</button></div></header>
      <main id="main-content" tabindex="-1" aria-live="polite"></main>
      <footer class="footer-note">Made for your everyday shifts <span>✳</span> NurseFlow Personal</footer>
    </div>
    <nav class="bottom-nav" aria-label="เมนูหลักบนโทรศัพท์">
      <button type="button" class="bottom-link active" data-page="home"><svg><use href="#ic-house"/></svg><span>หน้าหลัก</span></button>
      <button type="button" class="bottom-link" data-page="calendar"><svg><use href="#ic-calendar"/></svg><span>ตารางเวร</span></button>
      <button type="button" class="bottom-add" id="mobile-add" aria-label="เพิ่มเวร"><svg><use href="#ic-plus"/></svg></button>
      <button type="button" class="bottom-link" data-page="stats"><svg><use href="#ic-chart"/></svg><span>สถิติ</span></button>
      <button type="button" class="bottom-link" data-page="settings"><svg><use href="#ic-settings"/></svg><span>ตั้งค่า</span></button>
    </nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="./app.js" defer></script>
